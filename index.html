    :root {

    body { background: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

    /* Sidebar */

    .brand i { color: var(--accent); font-size: 1.4rem; filter: drop-shadow(0 0 8px var(--accent-glow)); }

    .cal-header { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 0.9rem; margin-bottom: 12px; color: var(--text-main); }

    .cal-date.today { border: 1px solid var(--accent); }

    .nav-item:hover, .nav-item.active { background: rgba(255, 255, 255, 0.05); color: #fff; }
    .nav-item.active { border-left: 3px solid var(--accent); }
